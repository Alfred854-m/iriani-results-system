<!DOCTYPE html>
<html>
<head><title>IRIANI Results V2</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
*{box-sizing:border-box;font-family:Arial;margin:0;padding:0}
body{background:#f1f5f9}
header{background:#0f4561;color:#fff;padding:14px 20px;display:flex;justify-content:space-between}
.card{background:#fff;border-radius:10px;padding:14px;margin:10px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.top{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:10px}
.main{display:grid;grid-template-columns:340px 1fr;gap:10px;margin:10px}
@media(max-width:800px){.main{grid-template-columns:1fr}}
input,select{width:100%;padding:10px;margin:6px 0;border:1px solid #cbd5e1;border-radius:8px}
button{width:100%;padding:11px;background:#0f4561;color:#fff;border:0;border-radius:8px;font-weight:700;cursor:pointer}
.btn-sm{width:auto;padding:5px 10px;font-size:12px;border-radius:6px}
.btn-red{background:#dc2626}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#0f4561;color:#fff;padding:8px;text-align:left}
td{padding:7px;border-bottom:1px solid #e2e8f0}
</style></head>
<body>
<div id="login" style="position:fixed;inset:0;background:#0f4561;display:flex;align-items:center;justify-content:center;z-index:99">
<div style="background:#fff;padding:24px;border-radius:12px;width:90%;max-width:360px">
<h2 style="text-align:center;color:#0f4561">🏫 IRIANI Secondary<br><small>Results System</small></h2>
<input id="u" value="teacher" placeholder="teacher">
<input id="p" type="password" value="1234" placeholder="1234">
<button onclick="if(u.value=='teacher'&&p.value=='1234'){localStorage.setItem('iriani_log','yes');login.style.display='none'}else alert('Use teacher / 1234')" style="margin-top:8px">Login</button>
</div></div>
<header><h1>🏫 IRIANI Secondary | Results</h1><button class="btn-sm btn-red" onclick="localStorage.removeItem('iriani_log');location.reload()">Logout</button></header>
<div class="top"><div class="card"><b id="tot">0</b><div>Total Students</div></div><div class="card"><b id="mean">0</b><div>Class Mean</div></div><div class="card"><b>Form 1-4</b><div>All Classes</div></div></div>
<div class="main">
<div>
<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Add Student</h3><button class="btn-sm btn-red" onclick="clearAll()">Clear All</button></div>
<input id="adm" placeholder="Adm No e.g 101"><input id="name" placeholder="Student Name"><select id="form"><option>Form 1</option><option>Form 2</option><option>Form 3</option><option>Form 4</option></select><button onclick="addStudent()">Add Student</button></div>
<div class="card"><h3>Enter Marks</h3><select id="stuSel"><option value="">-- Select Student --</option></select>
<input id="m1" type="number" placeholder="Maths"><input id="m2" type="number" placeholder="English"><input id="m3" type="number" placeholder="Kiswahili"><input id="m4" type="number" placeholder="Science"><input id="m5" type="number" placeholder="SST">
<button onclick="saveMarks()" style="background:#f59e0b;color:#000">Save Marks & Auto Grade</button></div>
</div>
<div class="card"><div style="display:flex;justify-content:space-between"><h3>Class Results - Ranked</h3><button class="btn-sm" onclick="window.print()">Print Report</button></div>
<table><thead><tr><th>Pos</th><th>Adm</th><th>Name</th><th>Total</th><th>Mean</th><th>Grade</th><th>Action</th></tr></thead><tbody id="tbody"></tbody></table>
<div id="empty" style="text-align:center;padding:20px;color:#64748b">No students yet. Add on left.</div></div>
</div>
<script>
let students=JSON.parse(localStorage.getItem('iriani_v2')||'[]');
function save(){localStorage.setItem('iriani_v2',JSON.stringify(students));render()}
function grade(m){if(m>=80)return'A';if(m>=70)return'B';if(m>=60)return'C';if(m>=50)return'D';return'E'}
function addStudent(){let a=adm.value.trim(),n=name.value.trim(),f=form.value;if(!a||!n)return alert('Enter Adm & Name');if(students.find(s=>s.adm==a))return alert('Adm exists');students.push({adm:a,name:n.toUpperCase(),form:f,total:0,mean:0,grade:'-'});adm.value='';name.value='';save()}
function saveMarks(){let id=stuSel.value;if(!id)return alert('Select student');let s=students.find(x=>x.adm==id);let ms=[+m1.value||0,+m2.value||0,+m3.value||0,+m4.value||0,+m5.value||0];let t=ms.reduce((a,b)=>a+b,0);let me=Math.round(t/5);s.total=t;s.mean=me;s.grade=grade(me);save();alert(s.name+' saved: '+t+' Mean '+me+' Grade '+s.grade)}
function deleteOne(a){if(!confirm('Delete Adm '+a+'?'))return;students=students.filter(s=>s.adm!=a);save()}
function clearAll(){if(!students.length)return alert('No students');if(!confirm('Delete ALL '+students.length+' students?'))return;students=[];localStorage.removeItem('iriani_v2');save()}
function render(){tbody.innerHTML='';let sorted=[...students].sort((a,b)=>b.total-a.total);let sum=0;sorted.forEach((s,i)=>{sum+=s.mean||0;tbody.innerHTML+=`<tr><td>${i+1}</td><td>${s.adm}</td><td>${s.name}</td><td>${s.total}</td><td>${s.mean}</td><td><b>${s.grade}</b></td><td><button class="btn-sm btn-red" onclick="deleteOne('${s.adm}')">Delete</button></td></tr>`});tot.innerText=students.length;mean.innerText=students.length?Math.round(sum/students.length):0;stuSel.innerHTML='<option value="">-- Select Student --</option>'+students.map(s=>`<option value="${s.adm}">${s.adm} - ${s.name}</option>`).join('');empty.style.display=students.length?'none':'block'}
if(localStorage.getItem('iriani_log')=='yes')login.style.display='none';
render();
</script>
</body>
</html>
